[package]
name = "wavecode-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/knliiss/WaveCode"
description = "WebAssembly API for the WaveCode V1 Rust core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wavecode = { path = "../wavecode" }
wasm-bindgen = "0.2"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
