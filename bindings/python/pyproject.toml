[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavecode-native"
version = "0.1.0"
description = "Python ctypes bindings for the WaveCode Rust C ABI"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "WaveCode contributors"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["wavecode_native*"]
