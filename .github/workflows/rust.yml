name: Rust

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The core must remain usable with no raster dependencies.
      - run: cargo clippy -p wavecode --all-targets --no-default-features -- -D warnings
      - run: cargo test -p wavecode --no-default-features

      # Check WebAssembly portability without requiring a browser runtime.
      - run: cargo check -p wavecode-wasm --target wasm32-unknown-unknown

      # Exercise real C, Python, and .NET calls into the compiled Rust library.
      - run: cargo build -p wavecode-ffi
      - name: C integration
        run: |
          cc samples/c/roundtrip.c -I include -L target/debug -lwavecode_ffi -o /tmp/wavecode-c-smoke
          LD_LIBRARY_PATH="$PWD/target/debug" /tmp/wavecode-c-smoke
      - name: Python integration
        run: |
          WAVECODE_LIBRARY="$PWD/target/debug/libwavecode_ffi.so" \
            PYTHONPATH=bindings/python python3 -m unittest discover -s bindings/python/tests -v
      - name: .NET integration
        run: |
          dotnet build bindings/dotnet/WaveCode.Sample/WaveCode.Sample.csproj -c Release
          WAVECODE_LIBRARY="$PWD/target/debug/libwavecode_ffi.so" \
            dotnet run --project bindings/dotnet/WaveCode.Sample -c Release --no-build

  native-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p wavecode-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: wavecode-native-${{ matrix.os }}
          path: |
            target/release/*wavecode_ffi.so
            target/release/*wavecode_ffi.dylib
            target/release/*wavecode_ffi.dll
            include/wavecode.h
          if-no-files-found: error
