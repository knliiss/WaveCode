name: V2 one-time Rust formatting

on:
  push:
    branches: [experiment/v2]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'knliiss/WaveCode' && github.ref == 'refs/heads/experiment/v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt only if changes are present
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "Rust formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/wavecode/src/v2 crates/wavecode/tests/v2_optical.rs crates/wavecode/tests/v2_adaptive.rs
          git commit -m "style(v2): format round-dot W experiment with rustfmt"
          git push origin HEAD:experiment/v2
