name: V2 temporary rustfmt (remove after run)
on:
  push:
    branches: [experiment/v2]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'knliiss/WaveCode' && github.ref == 'refs/heads/experiment/v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format current V2 and commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add -- crates/wavecode/src/v2/adaptive.rs crates/wavecode/src/v2/codec.rs crates/wavecode/src/v2/visual.rs crates/wavecode/src/v2/mod.rs crates/wavecode/tests/v2_adaptive.rs crates/wavecode/tests/v2_optical.rs crates/wavecode/examples/v2_experiment.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(v2): rustfmt mathematical dual packing and self-delimiting optical reader"
          git push origin HEAD:experiment/v2
