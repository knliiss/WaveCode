name: V2 temporary rustfmt
on:
  push:
    branches: [experiment/v2]
permissions:
  contents: write
jobs:
  fmt:
    if: github.repository == 'knliiss/WaveCode' && github.ref == 'refs/heads/experiment/v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/wavecode/src/v2
          git commit -m "style(v2): format version-only W and profile payload separation"
          git push origin HEAD:experiment/v2
